[package]
name = "arsenal-horizon"
version = "1.13.0"
edition = "2024"
license = "MIT"
publish = false
description = "Arsenal on Horizon, a native mod the Arsenal Launcher builds into Horizon."

# Its own workspace: the launcher's crate is not one.
[workspace]

# The mod's logic and its tests: the same file the bundle adds to the game.
[lib]
path = "mixins/arsenal/runtime.rs"

# The game's own (horizon-client's) crates the mod uses: for its tests here.
[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
