[mod]
id = "arsenal"
version = "1.5.0"
priority = 100

# The launcher pins this to the Horizon commit it builds on. It hooks only the native hook points
# (crates/horizon-client/src/game/native_hooks.rs), which keep their names and signatures.
[compatibility]
horizon_revision = "294448014fba585f8d5d09dd8886f482493b6417"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "arsenal_native"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

